name: Release Drafter

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # @v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
